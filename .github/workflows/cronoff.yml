# The one workflow file for Cronoff (made by yehon106). Create it ONCE in GitHub: Add file -> Create new file,
# type the name  .github/workflows/cronoff.yml  and paste this whole text. See START-HERE.md.
#
# It does three things:
#   1. Every time you upload files: moves loose files named like  api1auth.js  into their folders (api/auth.js), using arrange-files.js.
#      So you never have to upload a folder, only plain files.
#   2. Actions -> "Cronoff tasks" -> Run workflow -> fetch-language-files : saves Python, SQL and Lua into your repo.
#   3. Actions -> "Cronoff tasks" -> Run workflow -> build-desktop-apps    : builds the Windows, Mac and Linux apps.
name: Cronoff tasks

env:
  # The character in your file names that stands for "/" (api1auth.js -> api/auth.js). Change it here if you use another one,
  # for example "__" or "--" (see START-HERE.md). It must also be the one used in the names of the files you upload.
  SEPARATOR: "1"

on:
  push:
  workflow_dispatch:
    inputs:
      task:
        description: "What do you want to do?"
        type: choice
        required: true
        default: build-desktop-apps
        options:
          - build-desktop-apps
          - fetch-language-files
          - arrange-files
      separator:
        description: "Only for arrange-files: the separator to use (empty = the SEPARATOR line at the top of this file)"
        required: false
        default: ""
      tag:
        description: "Only for build-desktop-apps: release name (any text without spaces, for example app-v1)"
        required: false
        default: "app-v1"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ 1. folders
  arrange:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.task == 'arrange-files')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Move loose files into their folders
        id: move
        run: |
          if [ -f arrange-files.js ]; then
            node arrange-files.js --sep "${{ github.event.inputs.separator || env.SEPARATOR }}"
          else
            echo "arrange-files.js is not in the repo yet: upload it (it is in the zip)."
            echo "moved=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the folders
        if: steps.move.outputs.moved != '0'
        run: |
          git config user.name "cronoff-bot"
          git config user.email "cronoff-bot@users.noreply.github.com"
          git add -A
          git commit -m "Move uploaded files into their folders"
          git push

  # ------------------------------------------------------------------ 2. language files
  language-files:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'fetch-language-files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download (checked against npm's hashes)
        run: node local-server/get-vendor.js
      - name: Save into the repository
        run: |
          git config user.name "cronoff-bot"
          git config user.email "cronoff-bot@users.noreply.github.com"
          git add -f vendor
          git diff --cached --quiet && echo "Nothing new to save" || (git commit -m "Add language runtime files (Python, SQL, Lua)" && git push)

  # ------------------------------------------------------------------ 3. desktop apps
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-desktop-apps'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build the app
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            desktop/dist/Cronoff-Setup.exe
            desktop/dist/Cronoff-Mac.dmg
            desktop/dist/Cronoff-Linux.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Show what was built
        run: ls -la apps
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Cronoff apps (${{ github.event.inputs.tag }})
          body: |
            Cronoff desktop app. Works offline.
            - Windows: Cronoff-Setup.exe
            - Mac: Cronoff-Mac.dmg
            - Linux: Cronoff-Linux.AppImage (make it executable, then run it)
            The apps are not code-signed, so Windows and Mac show a warning the first time. See SETUP-DESKTOP-APP.md.
          files: apps/*
          make_latest: true
